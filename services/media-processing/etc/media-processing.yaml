Name: media-processing-api
Host: 0.0.0.0
Port: 8004

CORS:
  # 浏览器跨域（Vite 前端默认 http://localhost:5173，控制台页面 http://localhost:8080）。
  AllowCredentials: false
  AllowOrigins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:4173"
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "*"
  AllowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  AllowHeaders:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - X-Requested-With
  ExposeHeaders:
    - Content-Length
    - Content-Type
  MaxAge: 86400

# DRM / 版权声明头透传 + 可选平台 RSA-PSS 签名（不落密钥、不解密）。
# openssl genrsa -out drm_proxy.pem 2048
DRMPass:
  AttestSigning: false
  Issuer: "audio-ai-media-processing"
  # SigningKeyPath: drm_proxy.pem

# PostgreSQL（pgx/sql）：必须使用 libpq 关键字或 postgres:// URL，勿写成 MySQL 风格 user@tcp(...)
Postgres:
  DataSource: host=14.103.202.69 port=5432 user=admin password=admin123 dbname=audio_platform sslmode=disable TimeZone=Asia/Shanghai

Redis:
  Addr: "14.103.202.69:6379"
  Password: "cjs110017"
  DB: 0
  Optional: true

Auth:
  # 与网关签发的 access JWT secret 保持一致
  AccessSecret: audio-ai-platform-user-secret

# 若填写设备服务 HTTP 地址，则 /api/v1/device/play/audio 与 /api/v1/device/play/seek
# 会将请求转发到设备服务同一业务接口（JWT 会从当前请求 Authorization 透传）。
# DeviceService:
#   BaseURL: http://127.0.0.1:8002

Stream:
  # 推流地址拼装：例如 rtmp://stream.example.com/live/
  RTMPBaseURL: rtmp://stream.example.com/live/
  # 可选：FLV 基础地址，例如 https://stream.example.com/live/
  FLVBaseURL: https://stream.example.com/live/
  # token 鉴权默认密钥；若 stream_auth_configs 有 default 配置，会优先使用表中 secret_key
  DefaultSecretKey: dev-stream-secret
  # 默认鉴权配置 ID
  DefaultConfigID: default
  # 默认过期秒数（客户端未传则用此值）
  DefaultExpiresSec: 180

SQS:
  Enabled: false
  Endpoint: http://localhost:4566
  QueueURL: ""
  Region: us-east-1

Log:
  ServiceName: media-processing-api
  Mode: console
  Level: info

# Spotify 第三方音频源配置（用于获取第三方音频流地址）
Spotify:
  ClientID: "your-spotify-client-id"
  ClientSecret: "your-spotify-client-secret"
  BaseURL: "https://api.spotify.com/v1"
  MockMode: true  # 开发测试模式，使用模拟数据（生产环境请设为false）

