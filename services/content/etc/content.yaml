Name: content-api
Host: 0.0.0.0
Port: 8003
# 大文件上传：略大于单音频上限（字节）
MaxBytes: 134217728

# 浏览器跨域（对应 common/cors.Config）。
CORS:
  AllowCredentials: false
  AllowOrigins:
    - "*"
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - "*"

Database:
  # PostgreSQL（与 docker-compose / go-admin 一致）；执行过 045_content_service_catalog 迁移
  DataSource: host=14.103.202.69 port=5432 user=admin password=admin123 dbname=audio_platform sslmode=disable TimeZone=Asia/Shanghai

Storage:
  # 为 true 时从 PostgreSQL public.sys_config 读取 upload_storage_*（与后台一致）。
  # 每项优先级：环境变量 > sys_config > YAML。
  # 迁移 021 默认 upload_storage_driver=local；若在此处设为 true，须先在后台将该键改为 oss，否则会覆盖本节 Driver。
  SyncFromSysConfig: false
  Driver: oss
  Region: cn-beijing
  Endpoint: oss-cn-beijing.aliyuncs.com
  # ⚠️ AK/SK 必须放在这里（Storage下面），不能放在 oss: 子节点下！
  AccessKey: "LTAI5t86RwbEQ99p4APHRz2N"
  SecretKey: "rL8Xfkq4kO7EljvPtsfw4blgFOsUTz"
  Bucket: "220aaa"
  UsePathStyle: true
  CdnBaseUrl: ""


Local:
  # OSS 为主时私有格式仍会镜像到此目录（路径与 OSS object_key 一致）
  Root: ./data/content-objects

Upload:
  AudioMaxMB: 100
  CoverMaxMB: 10
  # 私有格式整包上传上限（MB）；需小于等于 RestConf.MaxBytes
  PrivateFormatMaxMB: 128
  PrivateFormatLocalMirror: true

# 内容列表热点缓存（秒，建议 300–600，对应 5～10 分钟）；仅无分类/标签/关键词/会员筛时启用
List:
  CacheEnabled: true
  CacheTTLSeconds: 600
  HotPlayThreshold: 1000

# 首页推荐：Redis 池 20～50 条，Key 带版本号与 content:list:ver 联动；TTL 建议 300～900
Recommend:
  CacheEnabled: true
  CacheTTLSeconds: 600
  PoolSize: 50

# 会员内容降级试听时长（秒）；实际试听不超过音频总时长
ContentAuth:
  PreviewSeconds: 60

Redis:
  Addr: "14.103.202.69:6379"
  Password: "cjs110017"
  DB: 0

# 非空时开放 POST /api/v1/content/internal/bump-list-cache，Header: X-Internal-Secret
# Internal:
#   ListCacheBumpSecret: "change-me-in-production"

Auth:
  AccessSecret: audio-ai-platform-user-secret
  AccessExpire: 3600

# 调用设备服务的 HTTP 根地址（内容与设备分进程部署时必填与真实设备 WS 同属一台或可 Redis relay）。
# Apifox 在 14.x 连 WS、却在 localhost 调 download 时会把指令下到本机，云端 WS 永远收不到。
Device:
  BaseURL: "http://127.0.0.1:8002"

# Spotify OAuth 配置（需要在 Spotify Developer Dashboard 创建应用）
Spotify:
  ClientID: "your-spotify-client-id"
  ClientSecret: "your-spotify-client-secret"
  CallbackBaseURL: "http://localhost:8003"  # 回调基础地址
  MockMode: true  # 开发测试模式，使用模拟数据（生产环境请设为false）

# QQ音乐 OAuth 配置（需要在 QQ音乐开放平台 创建应用）
QQMusic:
  AppID: "your-qq-music-app-id"
  AppSecret: "your-qq-music-app-secret"
  CallbackBaseURL: "http://localhost:8003"  # 回调基础地址
  MockMode: true  # 开发测试模式，使用模拟数据（生产环境请设为false）

Log:
  ServiceName: content-api
  Mode: console
  Level: info
