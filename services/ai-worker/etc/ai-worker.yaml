# 本地默认配置（默认 -f etc/ai-worker.yaml）；可按需对齐 k8s ConfigMap。
name: ai-worker-api
host: 0.0.0.0
port: 8004

CORS:
  AllowCredentials: false
  AllowOrigins:
    - "*"
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - "*"

Auth:
  AccessSecret: audio-ai-platform-user-secret

AI:
  ModelType: bsroformer
  ModelPath: ./models/bsroformer
  GPUDevice: 0
  SegmentSize: 10
  Overlap: 0.25
  UseFP16: true
  UseINT8: false
  BatchSize: 1
  MaxConcurrentJobs: 3
  UseCUDA: false
  CUDABenchmark: false
  NumThreads: 4
  InterThreads: 2
  OutputDir: ./data/output
  CacheDir: ./data/cache
  DefaultStems:
    - vocals
    - drums
    - bass
    - other

Storage:
  Driver: local
  Local:
    Root: ./data/ai-worker-objects

Log:
  Mode: console
  Level: info
  Encoding: json
