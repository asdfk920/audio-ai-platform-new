apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: audio-ai-platform
  labels:
    app: ai-worker
    component: inference
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
        component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # GPU 节点选择
      nodeSelector:
        gpu: "true"
        
      # 服务账户
      serviceAccountName: ai-worker-sa
      
      # 容器配置
      containers:
      - name: ai-worker
        image: audio-ai-platform/ai-worker:v1.0.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 8004
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        
        # 环境变量
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: MODEL_BASE_DIR
          value: "/app/models"
        - name: OUTPUT_DIR
          value: "/app/output"
        - name: CACHE_DIR
          value: "/app/cache"
        - name: GPU_DEVICE
          value: "0"
        - name: MAX_CONCURRENT_JOBS
          valueFrom:
            configMapKeyRef:
              name: ai-worker-config
              key: max_concurrent_jobs
        - name: DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: ai-worker-config
              key: default_model
        - name: USE_FP16
          valueFrom:
            configMapKeyRef:
              name: ai-worker-config
              key: use_fp16
        # 从 Secret 获取敏感配置
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-worker-secrets
              key: jwt_secret
        
        # 资源请求和限制
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: 1
        
        # 存储卷挂载
        volumeMounts:
        - name: model-data
          mountPath: /app/models
        - name: output-data
          mountPath: /app/output
        - name: cache-data
          mountPath: /app/cache
        - name: static-media
          mountPath: /app/static-media
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/etc
          readOnly: true
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # 启动探针
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        
        # 安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
      
      # 卷定义
      volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: ai-worker-models-pvc
      - name: output-data
        persistentVolumeClaim:
          claimName: ai-worker-output-pvc
      - name: cache-data
        emptyDir: {}
      - name: static-media
        persistentVolumeClaim:
          claimName: ai-worker-static-pvc
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: ai-worker-config
      
      # 优雅终止
      terminationGracePeriodSeconds: 120
      
      # Pod 反亲和性 (分散到不同节点)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ai-worker
              topologyKey: kubernetes.io/hostname
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: ai-worker-service
  namespace: audio-ai-platform
  labels:
    app: ai-worker
spec:
  type: ClusterIP
  selector:
    app: ai-worker
  ports:
  - name: http
    port: 80
    targetPort: 8004
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
# HPA - 水平自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-worker-hpa
  namespace: audio-ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
  # 基于 GPU 利用率扩缩容 (需要自定义指标)
  - type: Pods
    pods:
      metric:
        name: gpu_utilization
      target:
        type: AverageValue
        averageValue: "70"
  # 备选：基于 CPU 扩缩容
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-worker-config
  namespace: audio-ai-platform
data:
  max_concurrent_jobs: "3"
  default_model: "htdemucs"
  use_fp16: "true"
  segment_size: "10"
  overlap: "0.25"
  log_level: "info"
---
# PVC - 模型存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-models-pvc
  namespace: audio-ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd
  resources:
    requests:
      storage: 20Gi
---
# PVC - 输出存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-output-pvc
  namespace: audio-ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
# PVC - 静态文件
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-static-pvc
  namespace: audio-ai-platform
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 100Gi
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-worker-sa
  namespace: audio-ai-platform
automountServiceAccountToken: false
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-worker-ingress
  namespace: audio-ai-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.audio-ai-platform.com
    secretName: ai-worker-tls
  rules:
  - host: api.audio-ai-platform.com
    http:
      paths:
      - path: /api/v1/inference
        pathType: Prefix
        backend:
          service:
            name: ai-worker-service
            port:
              number: 80