# ============================================
# Prometheus 监控配置
# AI Worker Service - 音轨分离服务
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # AI Worker 服务监控
  - job_name: 'ai-worker'
    static_configs:
      - targets: ['ai-worker-service:9090']
        labels:
          service: 'ai-worker'
          component: 'inference'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # 认证配置 (如果需要)
    # bearer_token_file: /etc/prometheus/secrets/token
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-worker'

  # GPU 指标采集 (需要 nvidia-dcgm-exporter)
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-dcgm-exporter:9400']
        labels:
          service: 'gpu-metrics'
          
    scrape_interval: 5s

# 告警规则
rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        targets: 
          - 'alertmanager:9093'