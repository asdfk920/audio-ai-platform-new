version: '3.8'

services:
  # AI Worker 服务（GPU 版本）
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-worker:v1
    container_name: ai-worker
    
    # GPU 支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # 端口映射
    ports:
      - "8004:8004"
      - "9090:9090"
    
    # 环境变量
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    
    # 卷挂载
    volumes:
      - ./models:/app/models
      - ./data/output:/app/data/output
      - ./data/cache:/app/data/cache
      - ./data/objects:/app/data/ai-worker-objects
      - ./etc/ai-worker.yaml:/app/etc/ai-worker.yaml:ro
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 重启策略
    restart: unless-stopped
    
    # 日志
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络
    networks:
      - ai-network

  # Prometheus 监控（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - ai-network
    depends_on:
      - ai-worker

  # Grafana 可视化（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - ai-network
    depends_on:
      - prometheus

# 卷定义
volumes:
  prometheus_data:
  grafana_data:

# 网络定义
networks:
  ai-network:
    driver: bridge
