version: '3.8'

services:
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - CUDA_VERSION=11.8
        - CUDNN_VERSION=8.6
    image: audio-ai-platform/ai-worker:latest
    container_name: ai-worker-service
    restart: unless-stopped
    
    # GPU 配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    ports:
      - "8004:8004"
    
    volumes:
      # 模型目录 (持久化，避免重复下载)
      - model-data:/app/models
      # 输出目录 (分离结果)
      - output-data:/app/output
      # 缓存目录
      - cache-data:/app/cache
      # 静态媒体文件
      - static-media:/app/static-media
      # 日志
      - ./logs:/app/logs
      # 配置文件
      - ./etc:/app/etc
    
    environment:
      - TZ=Asia/Shanghai
      # 模型配置
      - MODEL_BASE_DIR=/app/models
      - OUTPUT_DIR=/app/output
      - CACHE_DIR=/app/cache
      - GPU_DEVICE=0
      - MAX_CONCURRENT_JOBS=3
      - DEFAULT_MODEL=htdemucs
      # 推理参数
      - SEGMENT_SIZE=10
      - OVERLAP=0.25
      - USE_FP16=true
      # 服务配置
      - LOG_LEVEL=info
      # 监控配置
      - PROMETHEUS_PORT=9090
      - SERVICE_NAME=ai-worker
    
    networks:
      - audio-ai-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    
    # 资源限制
    mem_limit: 8g
    cpus: '4.0'

volumes:
  model-data:
    driver: local
    name: ai-worker-models
  
  output-data:
    driver: local
    name: ai-worker-output
  
  cache-data:
    driver: local
    name: ai-worker-cache
  
  static-media:
    driver: local
    name: ai-worker-static

networks:
  audio-ai-network:
    driver: bridge
    name: audio-ai-platform