Name: device-api
Host: 0.0.0.0
Port: 8002

Postgres:
  DataSource: "postgres://admin:admin123@14.103.202.69:5432/audio_platform?sslmode=disable&TimeZone=Asia/Shanghai"
Redis:
  Addr: "14.103.202.69:6379"
  Password: "cjs110017"
  DB: 0

Auth:
  AccessSecret: audio-ai-platform-device-secret
  AccessExpire: 86400

DeviceAuth:
  TokenSecret: audio-ai-platform-device-secret
  TokenExpireSeconds: 86400
  TimestampToleranceSecond: 300
  FailureThreshold: 5
  LockSeconds: 300

# WebSocket 配置（设备长连接）
WebSocket:
  Enable: true
  Path: /ws/device
  ReadBufferSize: 10240
  WriteBufferSize: 10240
  PingInterval: 54s        # 心跳间隔（54秒，小于60秒超时）
  PongTimeout: 60s         # Pong超时时间
  MaxMessageSize: 65536    # 最大消息大小（64KB）
  EnableCors: true         # 允许跨域

DeviceShadow:
  HeartbeatTTLSeconds: 300
  EnableOnlineSet: true
  PubSubEnabled: true
  EventChannelPrefix: "device:shadow:"
  SeedTTLSeconds: 60

DeviceStatusQuery:
  OnlineStaleSeconds: 300
  DisableNegCache: false
  NegCacheTTLSeconds: 60
  RateLimitWindowSec: 60
  RateLimitMaxPerUser: 30
  DisableRateLimit: false

StatusReport:
  IntervalNormalSec: 60
  IntervalMidRangeSec: 120
  IntervalEnergySec: 300
  IntervalEmergencySec: 10
  IntervalMinSec: 10
  IntervalMaxSec: 300
  EnergyBatteryPercent: 20
  MidRangeBatteryPercent: 50

RedisKeyspace:
  Enabled: true

StatusPersist:
  QueueSize: 1000
  Workers: 4

DeviceCommand:
  DefaultExpiresSeconds: 300
  DefaultTimeoutSeconds: 30
  DefaultMaxRetry: 3
  DispatchBatchSize: 100
  WorkerIntervalSeconds: 10

Log:
  ServiceName: device-api
  Mode: console
  Level: info
