basePath: /api/v1
definitions:
  errorx.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  types.DeviceAuthReq:
    properties:
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
      token:
        description: 注册时获取的认证 token
        type: string
    required:
    - sn
    - token
    type: object
  types.DeviceAuthResp:
    properties:
      device_id:
        description: 设备 ID
        type: integer
      firmware_version:
        description: 固件版本号
        type: string
      message:
        description: 提示信息
        type: string
      model:
        description: 设备型号
        type: string
      sn:
        description: 设备序列号
        type: string
      success:
        description: 是否认证成功
        type: boolean
    type: object
  types.DeviceBindReq:
    properties:
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - sn
    type: object
  types.DeviceBindResp:
    properties:
      bound_at:
        description: 绑定时间
        type: string
      sn:
        description: 设备序列号
        type: string
    type: object
  types.DeviceDetailReq:
    properties:
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - sn
    type: object
  types.DeviceDetailResp:
    properties:
      bound_at:
        description: 绑定时间
        type: string
      firmware_version:
        description: 固件版本号
        type: string
      id:
        description: 设备 ID
        type: integer
      is_bound:
        description: 是否已绑定当前用户
        type: boolean
      model:
        description: 设备型号
        type: string
      online_status:
        description: 在线状态：1-在线、0-离线
        type: integer
      shadow:
        allOf:
        - $ref: '#/definitions/types.DeviceShadowInfo'
        description: 设备影子信息
      sn:
        description: 设备序列号
        type: string
    type: object
  types.DeviceListItem:
    properties:
      battery:
        description: 电量百分比
        type: integer
      bound_at:
        description: 绑定时间
        type: string
      firmware_version:
        description: 固件版本号
        type: string
      id:
        description: 设备 ID
        type: integer
      model:
        description: 设备型号
        type: string
      online_status:
        description: 在线状态：1-在线、0-离线
        type: integer
      run_state:
        description: 运行状态
        type: string
      sn:
        description: 设备序列号
        type: string
    type: object
  types.DeviceListResp:
    properties:
      list:
        description: 设备列表
        items:
          $ref: '#/definitions/types.DeviceListItem'
        type: array
      total:
        description: 设备总数
        type: integer
    type: object
  types.DeviceLocationResp:
    properties:
      accuracy:
        description: 定位精度（米）
        type: number
      is_latest:
        description: 是否为最新位置
        type: boolean
      last_report_time:
        description: 最后上报时间
        type: string
      online:
        description: 在线状态：online/offline
        type: string
      sn:
        description: 设备序列号
        type: string
      uwb:
        allOf:
        - $ref: '#/definitions/types.UWBPosition'
        description: UWB定位数据
    type: object
  types.DeviceNextReq:
    properties:
      action:
        description: 操作类型：next
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - sn
    type: object
  types.DeviceNextResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DevicePauseReq:
    properties:
      action:
        description: 操作类型：pause
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - sn
    type: object
  types.DevicePauseResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DevicePlayPlaylistParams:
    properties:
      playlist_id:
        description: 歌单ID，必填参数
        type: string
      start_index:
        description: 起始播放索引，可选，默认0
        type: integer
      volume:
        description: 播放音量，可选，范围0-100
        type: integer
    required:
    - playlist_id
    type: object
  types.DevicePlayPlaylistReq:
    properties:
      action:
        description: 操作类型：play_playlist
        type: string
      params:
        allOf:
        - $ref: '#/definitions/types.DevicePlayPlaylistParams'
        description: 播放歌单参数
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - params
    - sn
    type: object
  types.DevicePlayPlaylistResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      playlist:
        allOf:
        - $ref: '#/definitions/types.DevicePlaylistInfo'
        description: 歌单信息
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DevicePlayReq:
    properties:
      action:
        description: 操作类型：play/pause/stop/next/prev
        type: string
      media_url:
        description: 媒体资源 URL
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
      volume:
        description: 音量 0-100
        type: integer
    required:
    - action
    - sn
    type: object
  types.DevicePlayResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DevicePlaybackProgressResp:
    properties:
      current_time:
        description: 当前播放位置（秒）
        type: integer
      duration:
        description: 总时长（秒）
        type: integer
      note:
        description: 备注信息（设备离线时显示）
        type: string
      online:
        description: 设备在线状态：true-在线、false-离线
        type: boolean
      percentage:
        description: 播放进度百分比（保留一位小数）
        type: number
      remaining_time:
        description: 剩余时间（秒）
        type: integer
      sn:
        description: 设备序列号
        type: string
      timestamp:
        description: 进度记录时间
        type: string
    type: object
  types.DevicePlaybackStatus:
    properties:
      current_song:
        allOf:
        - $ref: '#/definitions/types.PlaybackCurrentSong'
        description: 当前播放歌曲信息
      mode:
        allOf:
        - $ref: '#/definitions/types.PlaybackMode'
        description: 播放模式信息
      progress:
        allOf:
        - $ref: '#/definitions/types.PlaybackProgress'
        description: 播放进度信息
      queue_length:
        description: 播放队列歌曲数量
        type: integer
      state:
        description: 播放状态：playing-播放中、paused-已暂停、stopped-已停止
        type: string
      volume:
        description: 当前音量值，范围0-100
        type: integer
    type: object
  types.DevicePlaybackStatusResp:
    properties:
      last_update:
        description: 最后更新时间
        type: string
      online:
        description: 设备在线状态：true-在线、false-离线
        type: boolean
      playback:
        allOf:
        - $ref: '#/definitions/types.DevicePlaybackStatus'
        description: 播放状态信息
      sn:
        description: 设备序列号
        type: string
    type: object
  types.DevicePlaylistInfo:
    properties:
      first_song:
        allOf:
        - $ref: '#/definitions/types.SongInfo'
        description: 第一首歌曲信息
      id:
        description: 歌单ID
        type: string
      name:
        description: 歌单名称
        type: string
      total_count:
        description: 歌曲总数
        type: integer
    type: object
  types.DevicePrevReq:
    properties:
      action:
        description: 操作类型：prev
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - sn
    type: object
  types.DevicePrevResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DeviceRebootReq:
    properties:
      action:
        description: 操作类型：reboot
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - sn
    type: object
  types.DeviceRebootResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DeviceResumeReq:
    properties:
      action:
        description: 操作类型：resume
        type: string
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
      volume:
        description: 音量 0-100
        type: integer
    required:
    - action
    - sn
    type: object
  types.DeviceResumeResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DeviceSetLoopParams:
    properties:
      mode:
        description: 循环模式：off-关闭循环、one-单曲循环、all-列表循环
        enum:
        - "off"
        - one
        - all
        type: string
    required:
    - mode
    type: object
  types.DeviceSetLoopReq:
    properties:
      action:
        description: 操作类型：set_loop
        type: string
      params:
        allOf:
        - $ref: '#/definitions/types.DeviceSetLoopParams'
        description: 循环播放参数
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - params
    - sn
    type: object
  types.DeviceSetLoopResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      loop:
        description: 设置后的循环模式
        type: string
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DeviceSetShuffleParams:
    properties:
      enable:
        description: 随机播放开关：true-开启随机播放、false-关闭随机播放
        type: boolean
    required:
    - enable
    type: object
  types.DeviceSetShuffleReq:
    properties:
      action:
        description: 操作类型：set_shuffle
        type: string
      params:
        allOf:
        - $ref: '#/definitions/types.DeviceSetShuffleParams'
        description: 随机播放参数
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - action
    - params
    - sn
    type: object
  types.DeviceSetShuffleResp:
    properties:
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      shuffle:
        description: 设置后的随机播放状态：true-已开启、false-已关闭
        type: boolean
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
    type: object
  types.DeviceShadowInfo:
    properties:
      battery:
        description: 电量百分比
        type: integer
      firmware_version:
        description: 固件版本号
        type: string
      ip:
        description: 设备 IP 地址
        type: string
      last_active_ms:
        description: 最后活跃时间（毫秒时间戳）
        type: integer
      run_state:
        description: 运行状态
        type: string
    type: object
  types.DeviceStatusUpdateReq:
    properties:
      online_status:
        description: 在线状态：1-在线、0-离线
        type: integer
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
    required:
    - online_status
    - sn
    type: object
  types.DeviceStatusUpdateResp:
    properties:
      online_status:
        description: 在线状态
        type: integer
      sn:
        description: 设备序列号
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  types.DeviceVolumeDownParams:
    properties:
      step:
        description: 音量减量，默认5，范围0-20
        type: integer
    type: object
  types.DeviceVolumeDownReq:
    properties:
      action:
        description: 操作类型：volume_down
        type: string
      params:
        allOf:
        - $ref: '#/definitions/types.DeviceVolumeDownParams'
        description: 音量减参数
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
      step:
        description: 音量减量，默认5，范围0-20
        type: integer
    required:
    - action
    - sn
    type: object
  types.DeviceVolumeDownResp:
    properties:
      current_volume:
        description: 当前音量值
        type: integer
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
      target_volume:
        description: 目标音量值
        type: integer
    type: object
  types.DeviceVolumeUpParams:
    properties:
      step:
        description: 音量增量，默认5，范围0-20
        type: integer
    type: object
  types.DeviceVolumeUpReq:
    properties:
      action:
        description: 操作类型：volume_up
        type: string
      params:
        allOf:
        - $ref: '#/definitions/types.DeviceVolumeUpParams'
        description: 音量加参数
      sn:
        description: 设备序列号，16位字母数字组合
        type: string
      step:
        description: 音量增量，默认5，范围0-20
        type: integer
    required:
    - action
    - sn
    type: object
  types.DeviceVolumeUpResp:
    properties:
      current_volume:
        description: 当前音量值
        type: integer
      instruction_id:
        description: 指令 ID
        type: integer
      message:
        description: 提示信息
        type: string
      status:
        description: 指令状态：delivered-已下发, cached-已缓存
        type: string
      target_volume:
        description: 目标音量值
        type: integer
    type: object
  types.PlaybackCurrentSong:
    properties:
      album:
        description: 专辑名称
        type: string
      artist:
        description: 艺术家
        type: string
      duration:
        description: 总时长（秒）
        type: integer
      media_name:
        description: 歌曲名称
        type: string
      media_url:
        description: 音频地址
        type: string
    type: object
  types.PlaybackMode:
    properties:
      loop:
        description: 循环模式：off-关闭循环、one-单曲循环、all-列表循环
        type: string
      shuffle:
        description: 随机播放：true-开启随机播放、false-关闭随机播放
        type: boolean
    type: object
  types.PlaybackProgress:
    properties:
      current_time:
        description: 当前播放位置（秒）
        type: integer
      duration:
        description: 总时长（秒）
        type: integer
      percentage:
        description: 播放进度百分比
        type: number
    type: object
  types.SongInfo:
    properties:
      artist:
        description: 歌手名称
        type: string
      duration:
        description: 歌曲时长（秒）
        type: integer
      song_name:
        description: 歌曲名称
        type: string
    type: object
  types.UWBPosition:
    properties:
      x:
        description: X坐标（米）
        type: number
      "y":
        description: Y坐标（米）
        type: number
      z:
        description: Z坐标（米）
        type: number
    type: object
host: localhost:8002
info:
  contact: {}
  description: 设备微服务 API 文档，包含设备管理、设备控制、设备状态查询等接口
  title: Device Service API
  version: "1.0"
paths:
  /api/v1/device/auth:
    post:
      consumes:
      - application/json
      description: 设备使用 token 向云端认证身份，获取设备信息
      parameters:
      - description: 设备认证请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DeviceAuthReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/types.DeviceAuthResp'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/errorx.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/errorx.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errorx.Response'
      security:
      - BearerAuth: []
      summary: 设备认证
      tags:
      - 设备管理
  /api/v1/device/bind:
    post:
      consumes:
      - application/json
      description: 用户将设备绑定到自己的账户下
      parameters:
      - description: 设备绑定请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DeviceBindReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/types.DeviceBindResp'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/errorx.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/errorx.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errorx.Response'
      security:
      - BearerAuth: []
      summary: 设备绑定
      tags:
      - 设备管理
  /api/v1/device/cmd/next:
    post:
      consumes:
      - application/json
      description: 用户通过 App 向设备下发下一首指令
      parameters:
      - description: 设备下一首请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DeviceNextReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/types.DeviceNextResp'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/errorx.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/errorx.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errorx.Response'
      security:
      - BearerAuth: []
      summary: 设备下一首
      tags:
      - 设备控制
  /api/v1/device/cmd/pause:
    post:
      consumes:
      - application/json
      description: 用户通过 App 向设备下发暂停指令
      parameters:
      - description: 设备暂停请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DevicePauseReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/types.DevicePauseResp'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/errorx.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/errorx.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errorx.Response'
      security:
      - BearerAuth: []
      summary: 设备暂停
      tags:
      - 设备控制
  /api/v1/device/cmd/play:
    post:
      consumes:
      - application/json
      description: 用户通过 App 向设备下发播放指令
      parameters:
      - description: 设备播放请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DevicePlayReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/types.DevicePlayResp'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/errorx.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/errorx.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errorx.Response'
      security:
      - BearerAuth: []
      summary: 设备播放
      tags:
      - 设备控制
  /api/v1/device/cmd/play_playlist:
    post:
      consumes:
      - application/json
      description: 用户通过 App 向设备下发播放歌单指令
      parameters:
      - description: 设备播放歌单请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.DevicePlayPlaylistReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
