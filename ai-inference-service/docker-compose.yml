version: '3.8'

services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-inference:latest
    container_name: inference-server
    ports:
      - "8004:8004"
    environment:
      - MODEL_NAME=bsroformer_scnet
      - GPU_DEVICE=0
      - MAX_BATCH_SIZE=1
      - MAX_CONCURRENT=3
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
