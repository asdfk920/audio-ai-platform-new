## ============================================================
## EMQX 5.8.9 配置文件 - HTTP 认证 + 设备管理微服务对接
## 目标服务器: 14.103.202.69:26120
## 后端服务: Device API (http://14.103.202.69:8002)
##
## 使用方式:
##   1. 将此文件复制到 /etc/emqx/emqx.conf.d/auth.conf
##   2. 重启 EMQX: systemctl restart emqx
##
## 注意: 此文件会覆盖默认认证设置，仅保留 HTTP 认证
## ============================================================

## ============================================================
## 节点名称和集群配置
## ============================================================
node {
    name = "emqx@127.0.0.1"
    cookie = "emqxsecretcookie123"
    data_dir = "/var/lib/emqx"
}

## ============================================================
## 日志配置
## ============================================================
log {
    console_handler {
        enable = true
        level = warning
        formatter = text
    }
    file_handler {
        enable = true
        level = info
        file = "/var/log/emqx/emqx.log"
        rotation {
            enabled = true
            max_bytes = 10485760
            rotation_count = 5
        }
    }
}

## ============================================================
## Dashboard 控制台配置
## ============================================================
dashboard {
    listeners.http {
        bind = "0.0.0.0"
        port = 18083
    }
    default_username = "admin"
    default_password = "audio_platform_2026"
}

## ============================================================
## MQTT 监听器配置
## ============================================================

### TCP MQTT (标准协议，端口1883)
listeners.tcp.default {
    bind = "0.0.0.0"
    port = 1883
    max_connections = 1024000
    max_conn_rate = 1000
    zone = default
}

### SSL/TLS MQTT (加密连接，端口8883)
listeners.ssl.default {
    bind = "0.0.0.0"
    port = 8883
    ssl_options {
        keyfile = "/etc/emqx/certs/key.pem"
        certfile = "/etc/emqx/certs/cert.pem"
        cacertfile = "/etc/emqx/certs/ca.pem"
    }
}

### WebSocket (Web客户端，端口8083)
listeners.ws.default {
    bind = "0.0.0.0"
    port = 8083
    mqtt_path = "/mqtt"
}

## ============================================================
## ⭐ 核心功能：HTTP 认证器配置（对接设备管理微服务）
## ============================================================
authentication {
    ## 启用认证（必须为true）
    enable = true

    ## 认证后端类型：http
    backend = "http"

    http {
        ## HTTP 方法: POST
        method = post

        ## ⭐⭐⭐ 关键配置：设备管理微服务认证接口地址
        url = "http://14.103.202.69:8002/mqtt/auth"

        ## 请求头
        headers {
            Content-Type = "application/json"
        }

        ## ⭐⭐⭐ 请求体模板（EMQX 变量替换）
        ## ${clientid} → 设备SN (如 SN-HP-002)
        ## ${username} → 设备SN (必须与clientid一致)
        ## ${password} → 设备密钥 (bcrypt哈希值)
        body = "{\"clientid\":\"${clientid}\",\"username\":\"${username}\",\"password\":\"${password}\"}"

        ## 连接超时时间（防止后端慢响应阻塞EMQX）
        connect_timeout = "5s"

        ## 连接池大小（支持高并发设备接入）
        pool_size = 32

        ## SSL 配置（如果后端是HTTPS则启用）
        ssl {
            enable = false
            ## 如果使用自签名证书，取消下面注释
            # cacertfile = "/etc/ssl/certs/ca-bundle.crt"
            # verify = verify_none
        }

        ## 重试策略
        retry {
            interval = "1s"
            max_times = 3
        }
    }
}

## ============================================================
## 断开连接 Webhook（可选，用于更新设备离线状态）
## ============================================================
webhook {
    ## 启用 Webhook
    enable = true

    ## URL: 设备断开连接处理接口
    url = "http://14.103.202.69:8002/mqtt/disconnect"

    ## 请求头
    headers {
        Content-Type = "application/json"
    }

    ## 消息体模板
    body = "{\"clientid\":\"${clientid}\",\"reason\":\"${reason}\"}"

    ## 连接池
    pool_size = 16

    ## 规则：监听所有客户端断开事件
    rules = [
        {
            event = "client_disconnected"
            action = ["webhook:1"]
        }
    ]
}

## ============================================================
## ACL 权限控制（基础规则）
## ============================================================
authorization {
    sources = []
    no_match = allow
    deny_action = ignore
}

## ============================================================
## 性能优化配置（适合物联网场景）
## ============================================================

### 连接限制
conn_max_alive_limit = infinity

### 会话过期时间（秒）
session {
    expiry_interval = "2h"
    max_subscriptions = 0
    upgrade_qos = false
    strict_mode = false
    max_inflight = 32
    max_mqueue_len = 1000
    retry_interval = "20s"
    max_awaiting_rel = 100
    await_rel_timeout = "300s"
}

### 消息队列
sysmon {
    vm {
        long_gc = "500ms"
        long_schedule = "300ms"
        large_heap = "64MB"
        busy_port = true
        busy_dist_port = true
    }
    os {
        cpu_check_interval = "60s"
        cpu_high_watermark = "80%"
        cpu_low_watermark = "60%"
        mem_check_interval = "60s"
        sysmem_high_watermark = "70%"
        procmem_high_watermark = "70%"
    }
}
